<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Smart Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #000000;
            --accent-white: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.4);
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* الشعاع المتحرك في الخلفية */
        .scanning-beam {
            position: fixed;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: skewX(-25deg);
            animation: moveBeam 6s infinite linear;
            z-index: 1;
        }

        @keyframes moveBeam {
            0% { left: -100%; }
            100% { left: 150%; }
        }

        /* الأضواء والوهج */
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .glow-1 { top: -200px; left: -200px; }
        .glow-2 { bottom: -200px; right: -200px; }

        /* حاوية البطاقة الرئيسية */
        .main-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 50px 25px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            animation: cardEntrance 1.2s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(50px) rotateX(10deg); }
            to { opacity: 1; transform: translateY(0) rotateX(0); }
        }

        /* مكان الصورة مع تأثير الشعاع */
        .profile-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 30px;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 5px;
            background: #000;
        }

        .profile-wrapper::before {
            content: "";
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid var(--accent-white);
            animation: orbit 4s linear infinite;
            clip-path: polygon(0 0, 50% 0, 50% 50%, 0 50%);
        }

        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* اسم الموقع مع تأثير الكتابة الرهيب */
        #site-name {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 40px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            min-height: 45px;
        }

        /* تصميم الأزرار */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 25px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .social-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.5s;
        }

        .social-btn:hover::before {
            left: 100%;
        }

        .social-btn:hover {
            background: white;
            color: black;
            transform: scale(1.03) translateY(-5px);
            box-shadow: 0 15px 30px rgba(255,255,255,0.1);
        }

        .social-btn i {
            font-size: 1.4rem;
        }

        .social-btn span {
            font-weight: 700;
            font-size: 1.1rem;
            flex-grow: 1;
            margin-right: 15px;
            text-align: right;
        }

        /* تأثير الحركة عند التحميل */
        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s forwards;
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="scanning-beam"></div>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="main-card">
        <div class="profile-wrapper">
            <img id="profile-img" class="profile-image" src="https://via.placeholder.com/150" alt="Profile">
        </div>

        <h1 id="site-name">...</h1>

        <div class="links-container">
            <a id="insta-url" href="#" class="social-btn fade-in-up" style="animation-delay: 0.2s;">
                <i class="fab fa-instagram"></i>
                <span>انستغرام</span>
            </a>
            <a id="tiktok-url" href="#" class="social-btn fade-in-up" style="animation-delay: 0.4s;">
                <i class="fab fa-tiktok"></i>
                <span>تيك توك</span>
            </a>
            <a id="fb-url" href="#" class="social-btn fade-in-up" style="animation-delay: 0.6s;">
                <i class="fab fa-facebook"></i>
                <span>فيسبوك</span>
            </a>
            <a id="phone-url" href="#" class="social-btn fade-in-up" style="animation-delay: 0.8s;">
                <i class="fas fa-phone"></i>
                <span>اتصال مباشر</span>
            </a>
        </div>
    </div>

    <script>
        // الرابط المباشر لتصدير البيانات كـ CSV
        const sheetID = '126ilAR3dYvW4NLzrorvfKTopvanRXfWufBTiqdnFn4s';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv`;

        async function loadData() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                
                // تقسيم الـ CSV بشكل احترافي يتعامل مع الفواصل داخل الروابط
                const rows = data.split('\n').map(row => {
                    const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    return matches ? matches.map(m => m.replace(/^"|"$/g, '')) : [];
                });

                // الصف الثاني (Index 1) هو مكان البيانات A2, B2...
                const config = rows[1];

                if (config && config.length >= 5) {
                    // الخلية A2: الاسم
                    document.getElementById('site-name').innerText = config[0];
                    // الخلية B2: رابط الصورة
                    document.getElementById('profile-img').src = config[1];
                    // الخلية C2: انستغرام
                    document.getElementById('insta-url').href = config[2];
                    // الخلية D2: تيك توك
                    document.getElementById('tiktok-url').href = config[3];
                    // الخلية E2: الهاتف
                    document.getElementById('phone-url').href = `tel:${config[4]}`;
                    
                    // الخلية F2 (اختياري للفيسبوك لو وضعت فيه رابط)
                    if(config[5]) {
                        document.getElementById('fb-url').href = config[5];
                    }
                }
            } catch (error) {
                console.error("خطأ في الربط:", error);
                document.getElementById('site-name').innerText = "تأكد من مشاركة الجدول";
            }
        }

        // تشغيل الوظيفة عند التحميل
        loadData();
    </script>
</body>
</html>
