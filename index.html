<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الحسني | متجر التطبيقات</title>
    <style>
        /* إعدادات الألوان والخطوط */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            /* تدرج لوني يطابق أيقونة هونسيتا */
            --honista-gradient: linear-gradient(135deg, #d91c5c, #ff6b35); 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* تصميم الهيدر (شريط التنقل) */
        header {
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 0;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 800;
            background: var(--honista-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        /* حاوية التطبيقات */
        .container {
            flex: 1;
            max-width: 600px;
            width: 90%;
            margin: 40px auto;
        }

        /* كرت التطبيق */
        .app-card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        /* أيقونة التطبيق */
        .app-icon {
            width: 85px;
            height: 85px;
            border-radius: 20px;
            background: var(--honista-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-left: 20px;
            flex-shrink: 0;
            box-shadow: 0 8px 20px rgba(217, 28, 92, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* تصميم خلية النحل الوهمية داخل الأيقونة في حال عدم وجود صورة */
        .app-icon::after {
            content: "H";
            font-size: 40px;
            font-weight: bold;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* تفاصيل التطبيق */
        .app-info {
            flex-grow: 1;
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 6px 0;
        }

        .app-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 16px 0;
            line-height: 1.4;
        }

        /* زر التحميل */
        .download-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-decoration: none;
            padding: 10px 28px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .download-btn:hover {
            background: var(--honista-gradient);
            border-color: transparent;
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        /* الفوتر (توقيع المطور) */
        footer {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 500;
        }

        footer span {
            color: #ff6b35;
        }
    </style>
</head>
<body>

    <header>
        <h1>موقع الحسني</h1>
    </header>

    <div class="container">
        
        <div class="app-card">
            <div class="app-icon">
                </div>
            
            <div class="app-info">
                <h2 class="app-title">Honista</h2>
                <p class="app-desc">نسخة معدلة وخالية من الإعلانات بمميزات حصرية.<br>تحميل مباشر (بدون جيلبريك)</p>
                <a href="itms-services://?action=download-manifest&url=https://bot.ipasign.cc/dl/20260509033200133/g4joiTHLRWiH.plist" class="download-btn">تثبيت</a>
            </div>
        </div>

    </div>

    <footer>
        &copy; 2026 تم التطوير بواسطة <span>حسين الحسني</span>
    </footer>

</body>
</html>
