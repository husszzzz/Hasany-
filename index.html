<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium NFC Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        :root {
            --bg-black: #080808;
            --main-white: #ffffff;
            --glow-opacity: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--main-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* تأثير الشعاع الضوئي المتحرك خلف البطاقة */
        .light-beam {
            position: fixed;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: skewX(-20deg);
            animation: sweep 5s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes sweep {
            0% { left: -150%; }
            50% { left: 100%; }
            100% { left: 150%; }
        }

        /* الإضاءة البيضاء في الزوايا */
        .corner-glow {
            position: fixed;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .top-left { top: -20%; left: -20%; }
        .bottom-right { bottom: -20%; right: -20%; }

        /* حاوية التصميم الرئيسي (Glassmorphism) */
        .profile-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        /* منطقة الصورة */
        .image-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 25px;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--main-white);
            padding: 4px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        /* تأثير الدائرة المتحركة حول الصورة */
        .image-container::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border: 1px solid var(--main-white);
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        /* اسم الموقع المتحرك */
        #site-name {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 35px;
            background: linear-gradient(to right, #fff 20%, #666 50%, #fff 80%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* أزرار الروابط */
        .links-stack {
            display: grid;
            gap: 15px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 25px;
            border-radius: 18px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.4s all cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .link-item:hover {
            background: #fff;
            color: #000;
            transform: scale(1.05);
        }

        .link-item i {
            font-size: 1.3rem;
            width: 30px;
        }

        /* شاشة التحميل */
        #loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9rem;
            letter-spacing: 2px;
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <div class="light-beam"></div>
    <div class="corner-glow top-left"></div>
    <div class="corner-glow bottom-right"></div>

    <div class="profile-card" id="card" style="display: none;">
        <div class="image-container">
            <img id="pfp" src="" alt="Profile">
        </div>

        <h1 id="site-name"></h1>

        <div class="links-stack">
            <a href="#" id="insta" class="link-item" target="_blank">
                <i class="fab fa-instagram"></i>
                <span>انستغرام</span>
            </a>
            <a href="#" id="tiktok" class="link-item" target="_blank">
                <i class="fab fa-tiktok"></i>
                <span>تيك توك</span>
            </a>
            <a href="#" id="fb" class="link-item" target="_blank">
                <i class="fab fa-facebook-f"></i>
                <span>فيسبوك</span>
            </a>
            <a href="#" id="phone" class="link-item">
                <i class="fas fa-phone-alt"></i>
                <span>اتصال</span>
            </a>
        </div>
    </div>

    <div id="loader">جاري مزامنة البيانات...</div>

    <script>
        // رابط الجدول الخاص بك (بصيغة التصدير المباشر)
        const sheetID = '126ilAR3dYvW4NLzrorvfKTopvanRXfWufBTiqdnFn4s';
        const publicUrl = `https://docs.google.com/spreadsheets/d/${sheetID}/export?format=csv`;

        function init() {
            Papa.parse(publicUrl, {
                download: true,
                header: false,
                complete: function(results) {
                    const data = results.data;
                    
                    // السطر الثاني هو الذي يحتوي البيانات (Index 1)
                    // الخلية A2 = data[1][0]
                    // الخلية B2 = data[1][1] ... وهكذا
                    if (data && data.length > 1) {
                        const row = data[1];

                        document.getElementById('site-name').innerText = row[0] || "اسم الموقع";
                        document.getElementById('pfp').src = row[1] || "";
                        document.getElementById('insta').href = row[2] || "#";
                        document.getElementById('tiktok').href = row[3] || "#";
                        document.getElementById('phone').href = "tel:" + row[4];
                        
                        // إضافة رابط الفيسبوك من الخلية F2 (data[1][5]) إذا وجدت
                        if(row[5]) document.getElementById('fb').href = row[5];

                        // إظهار البطاقة وإخفاء التحميل
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('card').style.display = 'block';
                    }
                },
                error: function(err) {
                    console.error("خطأ في جلب البيانات:", err);
                    document.getElementById('loader').innerText = "خطأ في الاتصال بالجدول";
                }
            });
        }

        // تشغيل العملية
        window.onload = init;
    </script>
</body>
</html>
